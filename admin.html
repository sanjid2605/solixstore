<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>SOLIX Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    input,select{width:100%;padding:11px;background:#1d1d22;color:var(--text);border:1px solid var(--line);border-radius:8px;font:inherit}
    input[type=checkbox]{width:auto}
    .tab{background:transparent;color:var(--text);padding:8px 10px;border-radius:8px;border:1px solid transparent}
    .tab.active{background:var(--panel);border-color:var(--line)}
    .toolbar{display:flex;gap:10px;margin-bottom:14px}
    .toolbar .btn{flex:0 0 auto;padding:10px 16px}
    .row{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
    .row img,.row .noimg{width:56px;height:56px;object-fit:cover;border-radius:8px;background:#222}
    .row .btns{grid-column:1/-1}
    .mini{padding:7px 10px;border-radius:8px;background:#26262c;color:var(--text);font-size:.8rem;margin:2px}
    .mini.danger{background:#5a1620}
    .mini.on{background:var(--red);color:#fff}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:40;overflow:auto;padding:12px}
    .modal-box{max-width:560px;margin:16px auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
    .field{margin-top:12px}
    .field label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
    .size-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
    .size-grid span{font-weight:700;font-size:.85rem}
    .img-item{position:relative;width:88px;display:inline-block;margin:4px;vertical-align:top;text-align:center}
    .img-item img{width:88px;height:88px;object-fit:cover;border-radius:8px}
    .img-item .mini{width:100%;margin:2px 0 0;font-size:.7rem}
    .order{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
    .order.new{border-color:var(--accent)}
    .muted{color:var(--muted);font-size:.85rem}
    .total-line{margin-top:10px;font-weight:700}
  </style>
</head>
<body>
  <div id="login" class="container" style="max-width:380px;padding-top:70px">
    <h2 style="margin-bottom:16px">SOLIX Admin</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" style="margin-top:10px">
    <button class="btn btn-primary" id="login-btn" style="width:100%;margin-top:14px">Login</button>
  </div>

  <div id="app" class="hidden">
    <header class="site-header">
      <strong style="letter-spacing:3px">SOLIX ADMIN</strong>
      <div>
        <button class="tab active" data-tab="products">Products</button>
        <button class="tab" data-tab="orders">Orders <span class="cart-count hidden" id="order-badge">0</span></button>
        <button class="tab" id="logout">Logout</button>
      </div>
    </header>

    <main class="container">
      <section id="tab-products">
        <div class="toolbar">
          <input id="search" placeholder="Search product name">
          <button class="btn btn-primary" id="add-product">+ Add</button>
        </div>
        <div id="plist"></div>
        <div class="pager"><button id="more" class="hidden">Load more</button></div>
      </section>

      <section id="tab-orders" class="hidden">
        <div id="olist"></div>
      </section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="m-title">Add product</h3>

      <div class="field"><label>Product name</label><input id="f-name"></div>
      <div class="field"><label>Offer price (selling price)</label><input id="f-price" type="number" min="0"></div>
      <div class="field"><label>Original price (optional)</label><input id="f-old" type="number" min="0"></div>

      <div class="field"><label><input type="checkbox" id="f-has"> This product has sizes (S, M, L, XL, XXL)</label></div>

      <div class="field" id="sizes-box">
        <label>Stock for each size</label>
        <div class="size-grid">
          <span>S</span><span>M</span><span>L</span><span>XL</span><span>XXL</span>
          <input type="number" min="0" id="st-S" value="0">
          <input type="number" min="0" id="st-M" value="0">
          <input type="number" min="0" id="st-L" value="0">
          <input type="number" min="0" id="st-XL" value="0">
          <input type="number" min="0" id="st-XXL" value="0">
        </div>
      </div>

      <div class="field hidden" id="nosize-box"><label>Stock</label><input type="number" min="0" id="f-stock" value="0"></div>

      <div class="total-line">Total stock: <span id="f-total">0</span></div>

      <div class="field"><label><input type="checkbox" id="f-out"> Declare whole product Stock Out</label></div>

      <div class="field">
        <label>Images (first image is the main one)</label>
        <input type="file" id="f-files" accept="image/*" multiple>
        <div id="img-list" style="margin-top:8px"></div>
      </div>

      <div class="actions">
        <button class="btn btn-ghost" id="m-cancel">Cancel</button>
        <button class="btn btn-primary" id="m-save">Save</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
